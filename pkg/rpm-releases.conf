# RPM-based releases that packages are built for; the counterpart of
# pkg/releases.conf.
#
# Columns (whitespace separated):
#   name    docker image
#
# The release tag comes from the image's own %{dist} (.el9, .el10), so the
# same build serves RHEL, Rocky, AlmaLinux and Oracle Linux of that major
# version. The name is also the directory under pkg/packages/ and the Vagrant
# machine that tests it.
#
# Lines starting with '#' and empty lines are ignored.

el9    rockylinux/rockylinux:9
el10   rockylinux/rockylinux:10
