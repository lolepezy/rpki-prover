# Debian/Ubuntu releases that packages are built for.
#
# Columns (whitespace separated):
#   codename            docker image                version suffix   changelog distribution
#
# "version suffix" is appended to <upstream>-<revision>. Debian releases use
# the backports convention, so that the same upstream version orders
# correctly across suites:  0.9.9-1~deb12u1  <  0.9.9-1~deb13u1  <  0.9.9-1
# Ubuntu releases use the analogous ~ubuntuMM.MMu1, e.g. 0.9.9-1~ubuntu22.04u1.
# Use "-" for an empty suffix.
#
# Lines starting with '#' and empty lines are ignored.

bookworm   debian:bookworm-slim   ~deb12u1         bookworm
trixie     debian:trixie-slim     ~deb13u1         trixie
sid        debian:sid-slim        -                unstable
jammy      ubuntu:22.04           ~ubuntu22.04u1   jammy
noble      ubuntu:24.04           ~ubuntu24.04u1   noble
